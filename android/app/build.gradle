plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    println("key.properties found")
} else {
    println("key.properties not found")
}

android {
    configurations {
        all*.exclude group: 'org.json', module: 'json'
    }

    dataBinding {
        enabled = true
    }
    namespace = "com.baghdadbullion.bbhtrader"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358" //flutter.ndkVersion

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
//        jvmTarget = JavaVersion.VERSION_1_8
        jvmTarget = "11"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.baghdadbullion.bbhtrader"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26 //flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = 30 //flutter.versionCode
        versionName = "1.0.5" //flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            //flutter build appbundle --release
            //signingConfig = signingConfigs.debug

    minifyEnabled true
    shrinkResources true
    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // minifyEnabled false
            signingConfig = signingConfigs.release
        }
    }
}


// iPass SDK + Amplify liveness require okhttp3.ConnectionListener (not in OkHttp 4.11).
configurations.configureEach {
    resolutionStrategy {
        force 'com.squareup.okhttp3:okhttp:5.0.0-alpha.16'
        force 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.16'
    }
}

dependencies {
    implementation("com.github.iPass-MENA:iPass2.0NativeAndroidSDK:v2.17")
    implementation("com.github.iPass-MENA:iPass2.0CoreAndroidSDK:2.17")

    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.16'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.16'

    // For AGP 7.4+
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // For AGP 7.3
    // coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.3'
    // For AGP 4.0 to 7.2
    implementation 'org.json:json:20231013'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    // coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.9'

    implementation 'com.google.android.gms:play-services-wallet:19.4.0'
}

flutter {
    source = "../.."
}