  ios: true
  remove_alpha_ios: true
  image_path: "assets/png/launcher_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true # Add this line
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/png/
    - assets/svg/
    - assets/sounds/success.wav
    - assets/sounds/loginSound.wav
    - assets/sounds/depositSounmd.wav
    - assets/sounds/buySellSound.wav
    - assets/sounds/pendinOrderSound.wav
    - .env
    - assets/lottie/Presize_Maintenance.json
    - assets/lottie/Confetti.json
    - assets/html/

  fonts:
  - family: DINNextArabic
    fonts:
      - asset: assets/fonts/din_next_arabic_ultralight.ttf
        weight: 200
      - asset: assets/fonts/din_next_arabic_light.ttf
        weight: 300
      - asset: assets/fonts/din_next_arabic_regular.ttf
        weight: 400
      - asset: assets/fonts/din_next_arabic_medium.ttf
        weight: 500
      - asset: assets/fonts/din_next_arabic_bold.ttf
        weight: 700
      - asset: assets/fonts/din_next_arabic_heavy.ttf
        weight: 800
      - asset: assets/fonts/din_next_arabic_black.ttf
        weight: 900
  - family: DINNextEnglish
    fonts:
      - asset: assets/fonts/din_next_english_regular.ttf
        weight: 400
